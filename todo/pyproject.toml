[project]
name = "todo-cli-app"
version = "0.1.0"
description = "A simple CLI-based todo application with in-memory storage"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "rich>=13.0.0"
]

[project.scripts]
todo = "src.main:main"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "B", "SIM", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true